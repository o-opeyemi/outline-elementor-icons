name: Build plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEI_OUTPUT_DIR: ${{ runner.temp }}/outline-icons-for-elementor-dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - run: php -l outline-icons-for-elementor.php
      - name: Validate installable ZIP
        run: unzip -t "$LEI_OUTPUT_DIR/outline-icons-for-elementor.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: outline-icons-for-elementor
          path: ${{ runner.temp }}/outline-icons-for-elementor-dist/outline-icons-for-elementor.zip
          if-no-files-found: error
